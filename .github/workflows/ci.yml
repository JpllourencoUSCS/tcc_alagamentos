# Integração contínua (03/10/2026): a cada push/PR, roda a suíte do backend contra um
# PostgreSQL/PostGIS real (mesma imagem do docker-compose.yml) e compila o app Android.
# Resolve a pendência "validação contra banco real não confirmada em CI" do cronograma.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: alagamentos
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: alagamentos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alagamentos -d alagamentos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://alagamentos:ci-somente-teste@localhost:5432/alagamentos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aplicar schema.sql
        run: psql "postgresql://alagamentos:ci-somente-teste@localhost:5432/alagamentos" -v ON_ERROR_STOP=1 -f backend/db/schema.sql
      - name: Testes (contrato + integração)
        working-directory: backend
        run: python -m pytest tests/ -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de debug e rodar os testes de JVM
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain
