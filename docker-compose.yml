# Banco de desenvolvimento — PostgreSQL + PostGIS.
# Sobe um banco em localhost:5432 para testar backend/db/ e backend/benchmark/
# contra um Postgres real (Semana 5 do cronograma). Até 05/11/2026 era compartilhado
# com o time via Tailscale; desde então as portas só aceitam conexões da própria
# máquina (127.0.0.1). A senha vem de um ".env" que NÃO é commitado (copie de
# ".env.example" e troque o valor).
#
# Uso:
#   cp .env.example .env   # e edite a senha
#   docker compose up -d
#   psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f backend/db/schema.sql
#
# Dados ficam no volume "pgdata" (sobrevive a "docker compose down"; para
# apagar de vez, "docker compose down -v").

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: alagamentos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alagamentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env — veja .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-alagamentos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alagamentos} -d ${POSTGRES_DB:-alagamentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API FastAPI (03/10/2026) — mesma imagem do Dockerfile na raiz. Fica em
  # http://localhost:8000 (docs interativas em /docs); o emulador Android a
  # enxerga em http://10.0.2.2:8000 (padrão do app), que é o 127.0.0.1 do
  # computador. Só a própria máquina alcança a porta (05/11/2026).
  api:
    build: .
    container_name: alagamentos_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-alagamentos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alagamentos}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
